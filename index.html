<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Performance Max & Demand Gen Image Uploader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>📤 Performance Max & Demand Gen Image Uploader Tool</h1>

    <p>Select the account you want to upload your images to:</p>
    <div id="account-buttons"></div>

    <div id="active-account" class="active-account-box">
      <strong>Current account:</strong> Account_1
    </div>

    <hr />

    <!-- ✅ BOTÓN REAL -->
    <div class="uploader-box">
      <button id="uploadBtn" class="upload-btn">
        📁 Upload images
      </button>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
        style="display:none"
      />
    </div>

    <br />
    <button class="download" id="downloadCsvBtn">📥 Download CSV</button>

    <br /><br />
    <a
      href="https://app.creatopy.com/team/352367/project/3509284/templates"
      target="_blank"
      class="creatopy-button"
    >
      🎨 Go to Creatopy Website 🎨
    </a>
  </div>

  <footer>
    <p>Made with ❤️ by Max Ackerl</p>
  </footer>

  <script>
    const accounts = {
      Account_1: 'd7638f5a88dbee59f6df',
      Account_2: '0c66cc01e66de4ec45ad',
      Account_3: '0cd1cb40ac781484a4ce',
      Account_4: '6e4c476a4ce09f440217',
      Account_5: '3124b74564244bcc9612'
    };

    let currentAccount = null;
    let uploadedUrls = [];

    const accountButtonsContainer = document.getElementById('account-buttons');
    const activeAccountBox = document.getElementById('active-account');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');

    function renderButtons() {
      accountButtonsContainer.innerHTML = '';

      Object.keys(accounts).forEach(account => {
        const btn = document.createElement('button');
        btn.textContent = account;
        btn.className = 'account-button';
        if (account === currentAccount) btn.classList.add('active');
        btn.onclick = () => setAccount(account);
        accountButtonsContainer.appendChild(btn);
      });
    }

    function setAccount(account) {
      currentAccount = account;
      uploadedUrls = [];

      activeAccountBox.innerHTML =
        `<strong>Current account:</strong> ${account}`;

      renderButtons();
    }

    uploadBtn.onclick = () => {
      fileInput.click();
    };

    fileInput.onchange = async () => {
      const files = [...fileInput.files];
      if (!files.length) return;

      for (const file of files) {
        const url = await uploadToUploadcare(file);
        uploadedUrls.push(url);
      }

      alert(`✅ ${files.length} images uploaded`);
    };

    async function uploadToUploadcare(file) {
      const formData = new FormData();
      formData.append('UPLOADCARE_PUB_KEY', accounts[currentAccount]);
      formData.append('UPLOADCARE_STORE', '1');
      formData.append('file', file);

      const res = await fetch('https://upload.uploadcare.com/base/', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();
      return `https://ucarecdn.com/${data.file}/`;
    }

    document.getElementById('downloadCsvBtn').onclick = () => {
      if (!uploadedUrls.length) {
        alert('No images uploaded.');
        return;
      }

      let csv = 'image\n';
      uploadedUrls.forEach(url => csv += url + '\n');

      const blob = new Blob([csv], { type: 'text/csv' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'images.csv';
      link.click();
    };

    window.onload = () => {
      setAccount(Object.keys(accounts)[0]);
    };
  </script>
</body>
</html>
