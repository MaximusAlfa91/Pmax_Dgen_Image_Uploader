<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Uploadcare Multi-Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Uploadcare v4 -->
  <script type="module">
    import * as UC from "https://cdn.uploadcare.com/uploadcare-widget/4.x/uploadcare.min.js";
    window.UC = UC;
  </script>
</head>

<body>
  <div class="container">
    <h1>📤 Performance Max & Demand Gen Image Uploader Tool</h1>

    <p>Select the account you want to upload your images to:</p>
    <div id="account-buttons"></div>

    <div id="active-account" class="active-account-box">
      <strong>Current account:</strong> Account_1
    </div>

    <hr />

    <div id="uploader-container"></div>

    <br />
    <button class="download" onclick="downloadCSV()">📥 Download CSV</button>

    <br /><br />
    <a
      href="https://app.creatopy.com/team/352367/project/3509284/templates"
      target="_blank"
      class="creatopy-button"
    >
      🎨 Go to Creatopy Website 🎨
    </a>
  </div>

  <footer>
    <p>Made with ❤️ by Max Ackerl</p>
  </footer>

  <script>
    const accounts = {
      Account_1: 'd7638f5a88dbee59f6df',
      Account_2: '0c66cc01e66de4ec45ad',
      Account_3: '0cd1cb40ac781484a4ce',
      Account_4: '6e4c476a4ce09f440217',
      Account_5: '3124b74564244bcc9612'
    };

    let currentAccount = null;
    let uploader = null;
    let uploadedFiles = [];

    function renderButtons() {
      const container = document.getElementById('account-buttons');
      container.innerHTML = '';

      Object.keys(accounts).forEach(accountName => {
        const btn = document.createElement('button');
        btn.textContent = accountName;
        btn.className = 'account-button';

        if (currentAccount === accountName) {
          btn.classList.add('active');
        }

        btn.onclick = () => setAccount(accountName);
        container.appendChild(btn);
      });
    }

    function setAccount(accountName) {
      currentAccount = accountName;
      uploadedFiles = [];

      document.getElementById('active-account').innerHTML =
        `<strong>Current account:</strong> ${accountName}`;

      renderButtons();
      initUploader(accounts[accountName]);

      console.log(`✅ Switched to: ${accountName} (${accounts[accountName]})`);
    }

    function initUploader(publicKey) {
      const container = document.getElementById('uploader-container');
      container.innerHTML = '';

      uploader = UC.UploadCtxProvider({
        publicKey
      });

      const fileUploader = UC.FileUploader({
        multiple: true
      });

      uploader.subscribe(fileUploader);

      fileUploader.onChange(files => {
        uploadedFiles = files;
        console.log('📁 Files selected:', files);
      });

      container.appendChild(fileUploader);
    }

    async function downloadCSV() {
      if (!uploadedFiles.length) {
        alert('No files uploaded yet.');
        return;
      }

      let csv = 'image\n';

      for (const file of uploadedFiles) {
        const fileInfo = await file.promise();
        csv += fileInfo.cdnUrl + '\n';
      }

      const blob = new Blob([csv], { type: 'text/csv' });
      const urlBlob = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = urlBlob;
      a.download = 'images.csv';
      a.click();

      URL.revokeObjectURL(urlBlob);
    }

    window.onload = () => {
      const firstAccount = Object.keys(accounts)[0];
      setAccount(firstAccount);
    };
  </script>
</body>
</html>
